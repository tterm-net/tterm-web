# tTerm Web behind nginx: the page at APP_NAME, the machines' side at
# CONNECT_NAME, both straight to the core on this server. setup.sh fills in
# the names and puts this in /etc/nginx/sites-available/tterm-web.
#
# The core believes X-Real-IP only from here (see client_ip in
# tterm/api/connect.py), so nginx sets it from the real address and drops
# any CF-Connecting-IP a client sends: no one can pass for another address
# to get around the limits on sign-in codes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name APP_NAME CONNECT_NAME;
    server_tokens off;

    # Let's Encrypt proves the names here.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 of Ubuntu 24.04: http2 goes on the listen line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name APP_NAME;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/APP_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_NAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tterm:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        # The page's socket stays open as long as the page.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}

server {
    # nginx 1.24 of Ubuntu 24.04: http2 goes on the listen line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CONNECT_NAME;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/APP_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_NAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tterm:10m;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        # Agents keep their connection for days; they say something every
        # few seconds.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
